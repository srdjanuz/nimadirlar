<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Nurobod Tumani HD Yo'ldosh Xaritasi</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- Leaflet kutubxonasini ulash (Bloklanmaydi va tekin) -->
<link rel="stylesheet" href="https://unpkg.com" />
<script src="https://unpkg.com"></script>
<style>
body { margin: 0; padding: 0; font-family: sans-serif; }
#map { position: absolute; top: 0; bottom: 0; width: 100%; height: 100vh; }
#info-panel { 
    position: absolute; top: 15px; left: 15px; z-index: 1000; 
    background: rgba(255, 255, 255, 0.95); padding: 12px 20px; 
    border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.2); 
}
#info-panel h3 { margin: 0 0 5px 0; color: #1a1a1a; }
#info-panel p { margin: 0; color: #666; font-size: 13px; }
</style>
</head>
<body>

<div id="info-panel">
    <h3>Nurobod Tumani</h3>
    <p>Samarqand viloyati | HD Yo'ldosh Xaritasi</p>
</div>

<div id="map"></div>

<script>
    // Nurobod markazi koordinatasi [Kenglik, Uzunlik]
    const map = L.map('map').setView([39.6074, 66.3023], 14);

    // Eng tiniq va muammosiz yuklanadigan yo'ldosh xaritasi qatlami
    L.tileLayer('https://google.com{x}&y={y}&z={z}', {
        maxZoom: 20,
        attribution: 'Google Satellite'
    }).addTo(map);
</script>

</body>
</html>
